monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                # rotating_file produces dev-YYYY-MM-DD.log
                type: rotating_file
                # path: '%kernel.logs_dir%/%kernel.environment%.log'
                path: '%kernel.logs_dir%/dev.log'
                # ag: this will keep 14 daily files max and delete older ones
                max_files: 7
                level: debug
                channels: ['!event']
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!event']
            nested:
                type: rotating_file
                path: '%kernel.logs_dir%/test.log'
                level: debug
                max_files: 7
when@prod:
    monolog:
        handlers:
            main:
                # figers_crossed only dumps errors >= error
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # ag: nested is triggered when main his an error and debug info will be append to the output for better debugging info
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine']
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
